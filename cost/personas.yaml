# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng "(ví dụ)" bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 300
  base: 700
  high: 1000
  source: "spec.md §2: lớp L3 khoảng 700 học viên, cả khóa khoảng 1.000; low=300 là (tự ước tính), high=1.000 là kịch bản mở rộng ra cả khóa, không chỉ L3."

personas:           # Phân nhóm theo số ngày học có hoạt động trong 21 ngày; share cộng lại = 1.
  - name: hoc_it
    share: 0.495413
    uses_per_month: 2.5
    turns_per_session: 1
    source: "evidence/data-mining.md §3: 216/436 HV học 1–2 ngày/21 ngày. 2,5 phiên/tháng là (tự ước tính) trong khoảng quy đổi 1,4–2,9 ngày/30 ngày; 1 lượt AI/phiên là (tự ước tính) sau khi lọc tín hiệu. Phiên học không đồng nghĩa lần kẹt nặng."
  - name: hoc_vua
    share: 0.378440
    uses_per_month: 7
    turns_per_session: 2
    source: "evidence/data-mining.md §3: 165/436 HV học 3–6 ngày/21 ngày. 7 phiên/tháng là (tự ước tính) trong khoảng quy đổi 4,3–8,6 ngày/30 ngày; 2 lượt AI/phiên là (tự ước tính) sau khi lọc tín hiệu."
  - name: hoc_nhieu
    share: 0.126147
    uses_per_month: 14
    turns_per_session: 2
    source: "evidence/data-mining.md §3: 55/436 HV học ≥7 ngày/21 ngày; 14 phiên/tháng là (tự ước tính) vì nhóm ≥7 ngày không có trần. 2 lượt AI/phiên là (tự ước tính) sau khi lọc tín hiệu."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "(ví dụ) https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "(ví dụ) https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
